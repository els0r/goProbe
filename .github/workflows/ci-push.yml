name: CI Build / Test (Push)

on:
  - push

jobs:

  build-linux:
    name: Build / Test on Linux
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ^1.25
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Build for AMD64
      run: GOOS=linux GOARCH=amd64 go build -tags jsoniter -v ./...

    # -skip-benchmarks is a test-binary flag defined only in pkg/e2etest, so
    # that package runs in its own step and receives the flag via -args.
    - name: Test
      run: go test -tags jsoniter -v $(go list ./... | grep -v /pkg/e2etest)

    - name: Test E2E
      run: go test -tags jsoniter -v ./pkg/e2etest -args -skip-benchmarks
